name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRISM_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # The product ships on macOS only for now (VST3 + AU, universal binary).
  plugin:
    name: Plugin build (macOS universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPRISM_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/plugin/PrismMeter_artefacts/Release/AU/Prism Meter.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx PrMt NwCn
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PrismMeter-macOS
          path: |
            build/plugin/PrismMeter_artefacts/Release/VST3
            build/plugin/PrismMeter_artefacts/Release/AU
            build/plugin/PrismMeter_artefacts/Release/Standalone
          if-no-files-found: ignore
